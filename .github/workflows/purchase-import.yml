name: Purchase import contract and transaction checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s ml/purchase -p "test_*.py"
      - run: npm run build
      - run: docker build -t closet-beta .
      - name: Container smoke test without production credentials
        run: |
          docker run -d --name closet-beta -p 127.0.0.1:4173:4173 -e CLOSET_BIND_HOST=0.0.0.0 closet-beta
          for i in $(seq 1 20); do curl --fail http://127.0.0.1:4173/healthz && break || sleep 1; done
          curl --fail http://127.0.0.1:4173/version.json
          docker stop closet-beta
      # Real Ollama tests are deliberately separate: CI needs no model or API key.

